plugins {
    id 'io.jmix' version '2.8.2'
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.9'
    id 'maven-publish'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '2.8.2'
    projectId = 'umida'
}

group = 'uz.kapitalbank'
version = '0.0.1'

repositories {
    mavenCentral()
    maven {
        url = 'https://global.repo.jmix.io/repository/public'
    }
    maven {
        url = 'https://global.repo.jmix.io/repository/premium'
        credentials {
            username = rootProject['premiumRepoUser']
            password = rootProject['premiumRepoPass']
        }
    }
    maven {
        url "http://localhost:8081/repository/maven-public/"
        credentials {
            username = "ci-user"
            password = "user123"
        }
        allowInsecureProtocol = true // если без HTTPS
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "nexus"
            url = version.endsWith("SNAPSHOT") ?
                    uri("http://localhost:8081/repository/maven-snapshots/") :
                    uri("http://localhost:8081/repository/maven-releases/")

            credentials {
                username = "ci-user"
                password = "user123"
            }

            allowInsecureProtocol = true
        }
    }
}

dependencies {
    implementation 'io.jmix.translations:jmix-translations-ru'

    implementation 'io.jmix.groupgrid:jmix-groupgrid-flowui-starter'

    implementation 'io.jmix.charts:jmix-charts-flowui-starter'

    implementation 'io.jmix.pivottable:jmix-pivottable-flowui-starter'

    implementation 'io.jmix.superset:jmix-superset-flowui-starter'
    implementation 'io.jmix.superset:jmix-superset-starter'

    implementation 'io.jmix.reports:jmix-reports-starter'
    implementation 'io.jmix.reports:jmix-reports-rest-starter'
    implementation 'io.jmix.reports:jmix-reports-flowui-starter'

    implementation 'io.jmix.audit:jmix-audit-starter'
    implementation 'io.jmix.audit:jmix-audit-flowui-starter'

    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'io.jmix.datatools:jmix-datatools-starter'
    implementation 'io.jmix.datatools:jmix-datatools-flowui-starter'

    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
    implementation 'org.postgresql:postgresql'
    implementation 'com.oracle.database.jdbc:ojdbc11'
    implementation 'org.eclipse.persistence:org.eclipse.persistence.oracle'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'com.oracle.database.nls:orai18n:23.7.0.25.01'

    constraints {
        implementation('org.springframework.security:spring-security-core') {
            version { strictly('6.5.9') }
        }
        implementation('org.springframework.security:spring-security-config') {
            version { strictly('6.5.9') }
        }
        implementation('org.springframework.security:spring-security-web') {
            version { strictly('6.5.9') }
        }
        implementation('org.springframework.security:spring-security-crypto') {
            version { strictly('6.5.9') }
        }
    }
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

test {
    useJUnitPlatform()
}

idea {
    module {
        excludeDirs.addAll(files '.jmix',
                'node_modules',
                'src/main/frontend/generated/',
                'src/main/bundles'
        )
    }
}

vaadin {
    optimizeBundle = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

bootJar {
    archiveFileName = "app.jar"
}