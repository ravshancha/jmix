io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonPathQueryTextAreaField.helpIcon.dialog.header=Skript
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonPathQueryTextAreaField.helpIcon.dialog.content=<div>\
Bu yerda JSON daraxti bo‘ylab yurish uchun JSON path ko‘rsatish mumkin.\
  <p>Misol:</p>\
  Quyidagi JSON tuzilmasi mavjud bo‘lsa, <strong>$.store.book[*]</strong> skripti orqali barcha kitoblarni tanlashimiz mumkin\
  <br>\
  <code>\
            {<br>\
             &nbsp "store": {<br>\
             &nbsp &nbsp "book": [<br>\
             &nbsp &nbsp &nbsp {<br>\
             &nbsp &nbsp &nbsp &nbsp "category": "reference",<br>\
             &nbsp &nbsp &nbsp &nbsp "author": "Nigel Rees",<br>\
             &nbsp &nbsp &nbsp &nbsp "title": "Sayings of the Century",<br>\
             &nbsp &nbsp &nbsp &nbsp "price": 8.95<br>\
             &nbsp &nbsp &nbsp },<br>\
             &nbsp &nbsp &nbsp {<br>\
             &nbsp &nbsp &nbsp &nbsp "category": "fiction",<br>\
             &nbsp &nbsp &nbsp &nbsp "author": "Evelyn Waugh",<br>\
             &nbsp &nbsp &nbsp &nbsp "title": "Sword of Honour",<br>\
             &nbsp &nbsp &nbsp &nbsp "price": 12.99,<br>\
             &nbsp &nbsp &nbsp &nbsp "isbn": "0-553-21311-3"<br>\
             &nbsp &nbsp &nbsp }<br>\
             &nbsp &nbsp ],<br>\
             &nbsp &nbsp "bicycle": {<br>\
             &nbsp &nbsp &nbsp "color": "red",<br>\
             &nbsp &nbsp &nbsp "price": 19.95<br>\
             &nbsp &nbsp }<br>\
             &nbsp }<br>\
            }<br>\
  </code>\
  <br>\
  Murakkabroq misollar uchun JSON path hujjatlariga murojaat qiling.\
</div>

io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.helpIcon.dialog.header=Skript
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.label=Skript
io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.jsonGroovyCodeEditor.helpIcon.dialog.content=<div>\
Bu yerda ma’lumotlar to‘plamini shakllantiruvchi Groovy-skriptni ko‘rsatish mumkin. Skriptga\
  <br/>quyidagi o‘zgaruvchilar uzatiladi:\
  <ul>\
  <li><code>params</code> - hisobotning tashqi parametrlar xaritasi (map)</li>\
  <li><code>parentBand</code> - <code>BandData</code> turidagi obyekt ko‘rinishidagi ota polosa</li>\
  <li><code>dataManager</code> - <code>DataManager</code> turidagi obyekt, u entitetlar grafigini yuklash va \
  saqlash imkonini beradi</li>\
  <li><code>metadata</code> - <code>Metadata</code> turidagi obyekt, ilova metama’lumotlariga murojaat qilish imkonini beradi</li>\
  <li><code>currentAuthentication</code> - <code>CurrentAuthentication</code> turidagi obyekt, tizimga hozirda \
  autentifikatsiyadan o‘tgan foydalanuvchi bilan bog‘langan</li>\
  <li><code>applicationContext</code> - <code>ApplicationContext</code> turidagi obyekt, bean’larga kirish imkonini beradi</li>\
  <li><code>timeSource</code> - <code>TimeSource</code> turidagi obyekt, joriy vaqtni olish imkonini beradi</li>\
  </ul>\
</div>

