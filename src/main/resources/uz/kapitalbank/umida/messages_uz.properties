io.jmix.flowui.app.propertyfilter.dateinterval.component/NextLastIntervalField.includingCurrentHelperBtn.messageDialog.content = <div>\
  <p>\
     "joriyni qo‘shish" opsiyasi natijaviy intervalni siljitmaydi. Masalan, agar \
     oldingi ikki kun oralig‘i tanlangan bo‘lsa va <code>'04-MM-yyyy'</code> sanasi uchun \
     "joriyni qo‘shish" opsiyasi ishlatilmasa, unda natijaviy interval quyidagi sanalarni o‘z ichiga oladi:\
  </p>\
  <ul>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Agar yuqoridagi misolda "joriyni qo‘shish" opsiyasi ishlatilsa, unda natijaviy interval \
     quyidagi sanalarni o‘z ichiga oladi:\
  </p>\
  <ul>\
     <li>04-MM-yyyy;</li>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Ushbu qoida yil, oy, soat va daqiqa uchun ham amal qiladi.\
  </p>\
</div>

