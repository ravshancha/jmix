io.jmix.reportsflowui.view.template/outputNamePatternField.helpIcon.dialog.header=Chiqish fayli nomi
io.jmix.reportsflowui.view.template/outputNamePatternField.helpIcon.dialog.content=\
  <div>\
  Tayyor hisobotni yuklab olish uchun ishlatiladigan ixtiyoriy fayl nomi. \
  Fayl nomi andozasi doimiy satr bo‘lishi yoki hisobot parametrlarini o‘zgaruvchi sifatida o‘z ichiga olishi mumkin, masalan:\
  <br/>\
  <br/><code>${header.authorName}.xlsx</code>\
  <br/>\
  <br/>Bir nechta parametr va satrlarni birlashtirishdan iborat murakkabroq \
  andozalarni ham hisobot tuzilmasidagi istalgan polosada skript yordamida yaratish mumkin, masalan:\
  <br/>\
  <br/><code>${Root.title}.xlsx</code>\
  <br/>\
  <br/>bu yerda <code>title</code> quyidagi skript natijasidir:\
  <br/>\
  <br/><code>[['title' : ('Hisobot uchun ' + params['author'].firstName\
  <br/>+ ' ' + params['author'].lastName)]]</code>\
  </div>

