io.jmix.reportsflowui.view.report/detailsTab.localeFieldHelp.text=<div>Bu yerda hisobot nomini belgilashingiz mumkin. Hisobotlar ro‘yxatida ishga tushirish uchun\
  <br/>hisobot foydalanuvchi tizimga qaysi til bilan kirgan bo‘lsa, o‘sha tildagi nom bilan\
