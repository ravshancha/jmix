io.jmix.reportsflowui.view.report/parametersTab.validationFieldHelp.header=Validatsiya skripti
io.jmix.reportsflowui.view.report/parametersTab.validationFieldHelp.text=<div>Bu yerda hisobot parametri qiymatini tekshiruvchi Groovy-skriptni belgilashingiz mumkin.\
  <br/><code>showErrorMessage(String str)</code> metodi foydalanuvchiga validatsiya xatosi haqida xabar ko‘rsatish uchun ishlatiladi.\
  <br/>Skript parametrning <code>value</code> qiymatini tekshirishi va agar qiymat noto‘g‘ri bo‘lsa, <code>showErrorMessage()</code> metodini chaqirishi kerak.\
  <br/>\
  <br/>Masalan, <code>showErrorMessage('Noto‘g‘ri parametr')</code> hisobotni bajarish uchun parametr mos kelmaganda xabar chiqaradi.\
  <br/>\
   Skriptga quyidagi o‘zgaruvchilar uzatiladi:\
  <ul>\
  <li><code>params</code> - hisobotning tashqi parametrlari</li>\
  <li><code>dataManager</code> - <code>DataManager</code> turidagi obyekt, entitetlar grafigini yuklash va saqlash imkonini beradi</li>\
  <li><code>metadata</code> - <code>Metadata</code> turidagi obyekt, ilova metama’lumotlariga murojaat qilish imkonini beradi</li>\
  <li><code>currentAuthentication</code> - <code>CurrentAuthentication</code> turidagi obyekt, tizimga hozirda autentifikatsiyadan o‘tgan foydalanuvchi bilan bog‘langan</li>\
  <li><code>applicationContext</code> - <code>ApplicationContext</code> turidagi obyekt, bean’larga kirish imkonini beradi</li>\
  <li><code>showErrorMessage</code> - skriptda validatsiya muvaffaqiyatsiz bo‘lsa chaqiriladigan metod</li>\
  </ul>\
  <br/>Masalan, <code>showErrorMessage('Noto‘g‘ri parametr')</code> noto‘g‘ri parametr kiritilganda mos xabarni chiqaradi.\
</div>

