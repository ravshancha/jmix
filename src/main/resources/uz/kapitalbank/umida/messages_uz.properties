io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScript=Groovy skript yuklovchi parametrlari
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScriptHelp=<div> Dinamik atribut parametrlarini Groovy skripti yordamida yuklash imkonini beradi.\
<br/>Skript opsiyalar ro‘yxatini qaytarishi kerak. Dinamik atributlarga ega entity ga \
skript ichida <code>entity</code> o‘zgaruvchisi orqali murojaat qilish mumkin. E’tibor bering, <code>entity</code> o‘zgaruvchisi qidiruv komponentli \
filtrda foydalanilganda <code>null</code> bo‘lishi mumkin.\
<br/>\
<br/>Masalan:\
<br/><code>return ['code_1', 'code_2', (entity ? entity.code : 'code_0')]</code></div>

io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScript=SQL skript yuklovchi parametrlari
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScriptHelp=<div> Dinamik atribut parametrlarini SQL skripti yordamida yuklash imkonini beradi.\
  <br/>Skript opsiyalar ro‘yxatini qaytarishi kerak.\
  Skript ichida dinamik atribut qiymatlariga <code>entity</code> o‘zgaruvchisi orqali murojaat qilish mumkin. E’tibor bering, <code>entity</code> \
  qidiruv komponentli filtrda aniqlanmagan bo‘ladi.\
  <br/>\
  <br/>Masalan:\
  <br/><code>select street from db_Address e, where e.str.name = ${entity.+&lt;dynamic_Attr_Code&gt;}</code>\
  <br/>bu yerda &lt;dynamic_Attr_Code&gt; - mos dinamik atribut kodi</div>

io.jmix.dynattrflowui.view.categoryattr/joinClause=Join ifodasi
io.jmix.dynattrflowui.view.categoryattr/joinClauseHelp=<div>Ushbu maydon qiymati so‘rovning "from" qismiga qo‘shiladi. U vergul, "join" yoki "left join" bilan boshlanishi kerak.\
Dinamik atribut qiymatlariga skript ichida <code>entity</code> o‘zgaruvchisi orqali murojaat qilish mumkin:\
<br/>${entity.+&lt;dynamicAttributeCode&gt;}, bu yerda &lt;dynamicAttributeCode&gt; - mos dinamik atribut kodi. \
E’tibor bering, <code>entity</code> o‘zgaruvchisi qidiruv komponentli filtrda aniqlanmagan bo‘ladi.\
<br/>{E} ifodasi olinayotgan entity ning psevdonimi sifatida ishlatiladi. So‘rov bajarilganda u haqiqiy psevdonim bilan almashtiriladi.\
<br/>\
<br/>Masalan:\
<br/><code>join {E}.customer</code></div>

io.jmix.dynattrflowui.view.categoryattr/joinHelperText=<div>Ushbu maydon qiymati so‘rovning "from" qismiga qo‘shiladi. \
  U vergul, "join" yoki "left join" bilan boshlanishi kerak. Masalan: <code>join {E}.seller s</code></div>

io.jmix.dynattrflowui.view.categoryattr/whereClause=Where ifodasi
io.jmix.dynattrflowui.view.categoryattr/whereClauseHelp=Ushbu maydon qiymati so‘rovning "where" qismiga "and" sharti orqali qo‘shiladi. "where" so‘zi talab qilinmaydi, chunki u avtomatik qo‘shiladi.\
  <br/>{E} ifodasi olinayotgan entity ning psevdonimi sifatida ishlatiladi. So‘rov bajarilganda u haqiqiy psevdonim bilan almashtiriladi. \
  Dinamik atribut qiymatlariga skript ichida <code>entity</code> o‘zgaruvchisi orqali murojaat qilish mumkin. E’tibor bering, <code>entity</code> \
  qidiruv komponentli filtrda aniqlanmagan bo‘ladi.\
  <br/>\
  <br/>Masalan:\
  <br/><code>{E}.salary > ${entity.+&lt;dynamicAttrCode&gt;} and {E}.department = 'abc'</code>\
  <br/>bu yerda &lt;dynamicAttrCode&gt; - mos dinamik atribut kodi</div>

io.jmix.dynattrflowui.view.categoryattr/validationScript=Maxsus validatsiya
io.jmix.dynattrflowui.view.categoryattr/validationScriptHelp=<div>Parametrni saqlashdan oldin unga Groovy skript qo‘llash imkonini beradi.\
  <br/>Tekshiruv muvaffaqiyatsiz bo‘lsa, Groovy skripti xato xabarini qaytarishi kerak. Aks holda \
skript hech qanday qiymat qaytarmasligi yoki <code>null</code> qaytarishi kerak. \
  Qiymat skript ichida <code>value</code> o‘zgaruvchisi orqali mavjud. \
  Xato xabari shablon satridan foydalanadi \
  va formatlangan chiqarish uchun '${value}' kalitidan foydalanish mumkin.\
  <br/>\
  <br/>Masalan:\
  <br/><code>if (!value.StartsWith("to‘g‘ri qiymat")) return "value" '\\${value}' noto‘g‘ri"</code></div>

io.jmix.dynattrflowui.view.categoryattr/recalculationScript=Qayta hisoblash skripti
io.jmix.dynattrflowui.view.categoryattr/recalculationScriptHelp=<div>Ushbu parametr qiymatini hisoblash uchun ishlatiladigan Groovy skripti.\
  <br/> Skriptga quyidagi o‘zgaruvchilar uzatiladi: \
  <br/>\
  <br/><code>entity</code> - joriy tahrirlanayotgan entity \
  <br/>\
  <br/><code>dynamicAttributes</code> - kalit sifatida dinamik atribut kodi va qiymat sifatida atribut qiymati bo‘lgan jadval \
  <br/>\
  <br/>Dinamik atributlar jadvalidan foydalanilgan qayta hisoblash skripti misoli: \
  <br/>\
  <br/><code>if (dynamicAttributes['PassengerNumberOfSeats'] > 9) return 'Avtobus' else return 'Yo‘lovchi'</code> \
  <br/>\
  <br/>EntityValues klassidan foydalanilgan qayta hisoblash skripti misoli: \
  <br/>\
  <br/><code>import io.jmix.core.entity.EntityValues;\
  <br/>\
  <br/>if(EntityValues.getValue(entity,"+PassengerNumberOfSeats") > 9) return 'Avtobus' else return 'Yo‘lovchi'</code> \
  <br/>\
  <br/>Bog‘liq atributlar ro‘yxatidagi atributlardan biri o‘zgargan har safar skript bajariladi.</div>

