io.jmix.bpmflowui.view.modeler.properties.servicetask/failedJobRetryCycleFieldDescription=<div> \
Xususiyat <strong>failedJobRetryCycle</strong> Xizmat vazifasi bajarilish xatosi yuz berganda ma'lum vaqt oralig'i bilan bir necha marta bajarilishini kafolatlaydi.<br/>\
Masalan, urinishlar sikli ifodasi quyidagicha ko‘rinadi: <code>R5/PT1M</code>, bu yerda R5 5 ta urinishni, PR1M esa urinishlar orasidagi 1 daqiqalik intervalni anglatadi. <br/><br/>\
<code>R{retryCount}/PT{countOfUnits}{temporaryUnits}</code> bu "Urinishlar sikli" uchun umumiy format.<br/><br/>\
<h4>Ifoda tushuntirishi: </h4>\
<ul>\
  <li><code>retryCount</code> - urinishlar soni</li>\
  <li><code>PT{countOfUnits}{temporaryUnits}</code> - bu ISO8601 formatidagi <a href="https://calendars.fandom.com/wiki/ISO_8601#Durations" target="_blank">davomiylik ifodasi</a></li>\
  <li><code>countOfUnits</code> - vaqt birliklari miqdori</li>\
  <li><code>temporaryUnits</code> - vaqt birliklari turi (Y, M, W, D, H, M, S ISO8601 da)</li>\
</ul>\
<h4>foydalanish misoli:</h4>\
<ul>\
  <li><code>R7/PT1M</code> - har 1 daqiqada 7 ta urinish</li>\
  <li><code>R2/PT20S</code> - har 20 soniyada 2 ta urinish</li>\
  <li><code>R4/PT4H</code> - har 4 soatda 4 ta urinish</li>\
  <li><code>R20/PT7W</code> - har 7 haftada 20 ta urinish</li>\
</ul>\
<strong>Muhimi, xizmat vazifasining dastlabki bajarilishi ham urinish sifatida hisoblanadi. </strong><br/>\
See: <a href="https://www.flowable.com/open-source/docs/bpmn/ch07b-BPMN-Constructs#fail-retry" target="_blank">Fail Retry</a>\
</div>
