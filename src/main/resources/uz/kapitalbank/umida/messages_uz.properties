io.jmix.quartzflowui.view.trigger/cronExpressionHelpText=<div> Cron ifodasi — bu bo‘sh joy bilan ajratilgan oltita yoki yettita maydondan iborat ketma-ketlik: soniya, daqiqa, soat, kun, oy, hafta kuni, yil (ixtiyoriy). \
                Oy va hafta kuni inglizcha nomlarining dastlabki uchta harfi bilan ko‘rsatilishi mumkin. Misollar:\
                <ul>\
                    <li>0 0/5 * * * ? - har 5 daqiqada ishga tushirish </li>\
                    <li>0 0 0 * * ? - har kuni soat 00:00 da ishga tushirish</li>\
                    <li>0 0 8-10 * * ? - har kuni soat 8:00, 9:00 va 10:00 da ishga tushirish</li>\
                    <li>0 0/30 8-10 * * ? - har kuni soat 8:00, 8:30, 9:00, 9:30 va 10:00 da ishga tushirish</li>\
                    <li>0 10,44 14 ? 3 WED - mart oyining har chorshanbasida 14:10 va 14:44 da ishga tushirish</li>\
                    <li>0 15 10 ? * 6#3 - har oyning uchinchi jumasida soat 10:15 da ishga tushirish</li>\
                    <li>0 11 11 11 11 ? - har yili 11-noyabr kuni soat 11:11 da ishga tushirish</li>\
                    <li>0 0 0 25 12 ? - har yili 25-dekabr kuni yarim tunda ishga tushirish</li>\
                </ul>\
            </div>
io.jmix.quartzflowui.view.trigger/triggerRepeatMode=Takrorlash rejimi
io.jmix.quartzflowui.view.trigger/triggerRepeatModeHelpText=<div>Takrorlash rejimi vazifaning necha marta ishga tushirilishini belgilaydi:\
                <ul>\
                    <li>Bir martalik ishga tushirish - vazifa faqat bir marta ishga tushiriladi</li>\
                    <li>Cheklangan marta ishga tushirish - vazifa 'Takrorlar soni' + 1 (birinchi ishga tushirish) marta \
                    ko‘rsatilgan interval bilan ishga tushiriladi</li>\
                    <li>Cheksiz ishga tushirish - vazifa ko‘rsatilgan interval bilan cheksiz ravishda ishga tushiriladi</li>\
                </ul>\
                'Cheklangan marta ishga tushirish' va 'Cheksiz ishga tushirish' rejimlari tugash sanasi bilan (agar ko‘rsatilgan bo‘lsa) cheklanadi.\
            </div>
io.jmix.quartzflowui.view.trigger/triggerMisfireInstructionHelpText=<div>Ushbu strategiya vazifa ishga tushirilishi o‘tkazib yuborilgan holat aniqlanganda rejalashtiruvchining xatti-harakatini belgilaydi.\
            <p>Oddiy jadval:\
            <ul>\
                 <li><b>Smart-strategiya</b> - 'Takrorlar soni' ga bog‘liq:\
                     <ul>\
                         <li>Takrorlar bo‘lmasa, xatti-harakat <b>'Bir marta bajarish'</b> strategiyasiga teng</li>\
                         <li>Takrorlar soni cheklangan bo‘lsa, xatti-harakat <b>'Bir marta bajarish va takrorlar sonini saqlagan holda qayta rejalashtirish'</b> strategiyasiga teng</li>\
                         <li>Takrorlar soni cheksiz bo‘lsa, xatti-harakat <b>'Qolgan takrorlar soni bilan qayta rejalashtirish'</b> strategiyasiga teng</li>\
                     </ul>\
                 </li>\
                 <li><b>O‘tkazib yuborish strategiyasini e'tiborsiz qoldirish</b> - barcha o‘tkazib yuborilgan ishga tushirishlar darhol ketma-ket bajariladi. Shundan so‘ng vazifa odatiy jadvalga qaytadi</li>\
                 <li><b>Bir marta bajarish</b> - vazifa darhol bir marta bajariladi. Eslatma: ushbu strategiya bir martalik (takrorsiz) vazifalar uchun mo‘ljallangan. \
                      Aks holda xatti-harakat <b>'Bir marta bajarish va qolgan takrorlar soni bilan qayta rejalashtirish'</b> strategiyasiga teng bo‘ladi</li>\
                 <li><b>Takrorlar sonini saqlagan holda qayta rejalashtirish</b> - vazifa darhol bajarilmasdan odatiy jadvalga qaytadi. Barcha o‘tkazib yuborilgan ishga tushirishlar keyinchalik ushbu jadvalga muvofiq bajariladi (o‘tkazib yuborilganlar kelajakka 'suriladi')</li>\
                 <li><b>Qolgan takrorlar soni bilan qayta rejalashtirish</b> - vazifa darhol bajarilmasdan odatiy jadvalga qaytadi. Barcha o‘tkazib yuborilgan ishga tushirishlar bekor qilinadi va yo‘qoladi (agar cheklovlar bo‘lsa, umumiy ishga tushirishlar soni dastlab rejalashtirilgandan kam bo‘ladi)</li>\
                 <li><b>Bir marta bajarish va takrorlar sonini saqlagan holda qayta rejalashtirish</b> - vazifa darhol bir marta bajariladi, so‘ng odatiy jadvalga qaytadi. Qolgan o‘tkazib yuborilgan ishga tushirishlar keyinchalik jadvalga muvofiq bajariladi (o‘tkazib yuborilganlar kelajakka 'suriladi')</li>\
                 <li><b>Bir marta bajarish va qolgan takrorlar soni bilan qayta rejalashtirish</b> - vazifa darhol bir marta bajariladi, so‘ng odatiy jadvalga qaytadi. Qolgan o‘tkazib yuborilgan ishga tushirishlar bekor qilinadi va yo‘qoladi (agar cheklovlar bo‘lsa, umumiy ishga tushirishlar soni dastlab rejalashtirilgandan kam bo‘ladi).</li>\
            </ul>\
            <p>Cron ifodasi:\
            <ul>\
                 <li><b>Smart-strategiya</b> - <b>'Bir marta bajarish va davom ettirish'</b> ga teng</li>\
                 <li><b>O‘tkazib yuborish strategiyasini e'tiborsiz qoldirish</b> - barcha o‘tkazib yuborilgan ishga tushirishlar darhol ketma-ket bajariladi. Shundan so‘ng vazifa odatiy jadvalga qaytadi</li>\
                 <li><b>Bir marta bajarish va davom ettirish</b> - vazifa darhol bir marta bajariladi, so‘ng odatiy jadvalga qaytadi</li>\
                 <li><b>Hech narsa qilmaslik</b> - vazifa darhol bajarilmasdan odatiy jadvalga qaytadi. Barcha o‘tkazib yuborilgan ishga tushirishlar bekor qilinadi va yo‘qoladi</li>\
            </ul>\
        </div>

io.jmix.quartzflowui.view.trigger/repeatCountHelpText=<div>Vazifaning boshlang‘ich ishga tushirilishidan tashqari necha marta ishga tushirilishini belgilaydi\
