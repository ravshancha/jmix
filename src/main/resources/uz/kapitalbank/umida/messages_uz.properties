io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.tooltipMessage = <div>Ma’lumot yuklovchi so‘rovining "from" bo‘limiga \
  qo‘shiladigan JPQL ifodasi.<br/> \
   Bu bog‘langan kolleksiya atributi bo‘yicha shart yaratish uchun kerak bo‘lishi mumkin.<br><br> \
    Ushbu atribut qiymati "join" yoki "left join" iboralarini o‘z ichiga olishi kerak.<br/>\
  Ifodada tanlanayotgan obyekt aliasi o‘rniga <b>{E}</b> belgisidan foydalaning.<br><br>\
  Masalan:<br/>\
  <code>join {E}.tags t</code></div>

io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.helperText=<div>Ushbu atribut qiymati \
  "join" yoki "left join" iboralarini o‘z ichiga olishi kerak. Masalan: </span><code>join {E}.tags t</code></div>

io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.requiredMessage = "Where ifodasi" maydonini to‘ldiring

io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.tooltipMessage = <div>Ma’lumot yuklovchi so‘rovining \
  "where" shartiga qo‘shiladigan JPQL ifodasi. \
   Ifodada tanlanayotgan obyekt aliasi o‘rniga <b>{E}</b> belgisidan foydalaning.<br><br>\
  Shart parametri faqat bitta bo‘lishi mumkin va mavjud bo‘lsa <b>?</b> belgisi bilan ko‘rsatiladi.<br/>\
    Bundan tashqari, quyidagi oldindan belgilangan parametrlarni ishlatish mumkin:<ul>\
  <li><code>:current_user_&lt;attribute&gt;</code> – joriy foydalanuvchi atributi.</li>\
  <li><code>:session_&lt;attribute&gt;</code> – sessiya atributi.</li></ul>\
  Agar ifodada <b>like</b> operatori ishlatilsa, qiymat avtomatik ravishda \
  <code>(?i)%value%</code> ko‘rinishiga o‘raladi, bu esa registrga sezgir bo‘lmagan qidiruvni ta’minlaydi.<br/>\
  <br/>\
  <code>tags</code> kolleksiyasi atributi bo‘yicha obyekt nusxalarini tanlash misoli:<br/>\
  <code>t.name like ?</code></div>

