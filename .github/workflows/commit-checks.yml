  build-and-deploy:
    name: Building and Deploy the app
    runs-on: ubuntu-22.04
    steps:
      - name: SSH to VPS and build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: | 
            set -e

            mkdir -p /home/deploy
            cd /home/deploy
          
            if [ ! -d "jmix/.git" ]; then
            git clone git@github.com:ravshancha/jmix.git jmix
            fi
          
            cd jmix
            git pull origin master
          
            chmod +x gradlew
          
            ./gradlew clean bootBuildImage \
            -Pvaadin.productionMode=true \
            --no-daemon --stacktrace
          
            cd docker
            docker compose down
            docker compose up -d